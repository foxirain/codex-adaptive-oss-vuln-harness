[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-adaptive-oss-vuln-harness"
version = "0.3.0"
description = "Adaptive multi-session OSS vulnerability hunting harness for Codex"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "foxirain" }
]
dependencies = []

[project.scripts]
adaptive-oss-harness = "oss_harness.cli:main"

[tool.setuptools]
packages = ["oss_harness"]
